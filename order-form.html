<!DOCTYPE html>
<html>
<head>
    <title>Mohib Cookies Company - Order Form</title>
</head>
<body>

    <h1>Mohib Cookies Company</h1>
    <h2>Customer Order Form</h2>

    <form>

        <label for="name">Customer Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <br><br>

        <label for="cookie">Cookie Name:</label>
        <input type="text" id="cookie" placeholder="Enter cookie name" required>

        <br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="1" placeholder="Enter quantity" required>

        <br><br>

        <label for="address">Delivery Address:</label>
        <input type="text" id="address" placeholder="Enter your address" required>

        <br><br>

        <button type="submit">Place Order</button>

    </form>

</body>
</html>
